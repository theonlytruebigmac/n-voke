[package]
name = "nvoke-tui"
version = "0.2.3"
license = "MIT"
description = "Terminal interface for N-voke"
authors = ["theonlytruebigmac"]
edition = "2024"

[[bin]]
name = "nvoke"
path = "src/main.rs"

[dependencies]
serde_json = "1"
unicode-width = "0.2"
dirs = "6"
base64 = "0.23"
nvoke-core = { path = "../core" }
ratatui = "0.30"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

