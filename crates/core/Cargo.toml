[package]
name = "nvoke-core"
version = "0.2.4"
license = "MIT"
description = "Shared core of N-voke: API client, settings, keychain, encrypted local storage and audit log"
authors = ["theonlytruebigmac"]
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chacha20poly1305 = "0.11.0"
base64 = "0.23.1"
dirs = "6"
regex = "1"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
sha2 = "0.10"
ts-rs = { version = "12.0.1", optional = true }

# Generates the desktop app's TypeScript types from the Rust types: `npm run bindings` (src/lib/migrate/bindings).
[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

