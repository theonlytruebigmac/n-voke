name: Release

# Pushing a version tag (v1.2.3) builds installers for Windows, macOS and Linux
# and publishes them as a GitHub release with generated notes. If any step fails
# the release stays a draft, so nothing half-built is ever public.
#
#   verify  -> tag matches the app version, tests pass
#   draft   -> create (or reuse) a draft release
#   build   -> one job per platform, each uploads its installers to the draft
#   build-tui -> the terminal app, one job per platform, uploaded to the same draft
#   publish -> turn the draft into a public release
#
# See docs/RELEASING.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Re-run a release for an existing tag: choose the tag under "Use workflow from".
  workflow_dispatch:

# One release run per tag at a time; a newer push for the same tag replaces the older run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-22.04
    steps:
      - name: Require a tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow from a version tag (v1.2.3), not from a branch."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: node scripts/version.mjs --check --tag "$GITHUB_REF_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./crates/core -> target
            ./crates/tui -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Core crate tests
        run: cargo test --manifest-path crates/core/Cargo.toml

      - name: Terminal app tests
        run: cargo test --manifest-path crates/tui/Cargo.toml

  draft:
    name: Draft release
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create the draft release, or reuse it on a re-run
        id: release
        run: |
          # Drafts are invisible to the tag lookup endpoint, so search the full list.
          find_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1
          }

          id=$(find_id)
          if [ -z "$id" ]; then
            # Create through the API so the response carries the id; listing releases right
            # after creating one can miss it. The tag already exists (this run was started by it).
            # A tag with a hyphen (v1.2.3-1) is a pre-release.
            prerelease=false
            if [[ "$TAG" == *-* ]]; then prerelease=true; fi

            # Shown above the generated notes, so it is clear which file is which.
            desktop='**Desktop app:** `N-voke_*` installers (`.msi` / `.exe` for Windows, `.dmg` for macOS, `.AppImage` / `.deb` / `.rpm` for Linux).'
            terminal='**Terminal app:** `nvoke-tui-*` archives with a `.sha256` checksum each (Windows, macOS, Linux). Unpack and run `nvoke`.'
            body=$(printf '%s\n\n%s' "$desktop" "$terminal")

            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name="N-voke $TAG" \
              -f body="$body" \
              -F draft=true \
              -F prerelease=$prerelease \
              -F generate_release_notes=true \
              --jq .id)
          fi

          if [ -z "$id" ]; then
            echo "::error::Could not create or find the draft release for $TAG."
            exit 1
          fi

          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ''
          - name: macOS
            platform: macos-latest
            # One app that runs natively on both Apple Silicon and Intel Macs.
            args: '--target universal-apple-darwin'
          - name: Linux
            platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}

  build-tui:
    name: Terminal app (${{ matrix.name }})
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            asset: windows-x86_64
            archive: zip
          - name: macOS
            platform: macos-latest
            asset: macos-universal
            archive: tar.gz
          - name: Linux
            platform: ubuntu-22.04
            asset: linux-x86_64
            archive: tar.gz
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './crates/tui -> target'
          key: tui-${{ matrix.asset }}

      - name: Build
        working-directory: crates/tui
        run: |
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            # One binary that runs natively on both Apple Silicon and Intel Macs.
            cargo build --release --locked --target aarch64-apple-darwin
            cargo build --release --locked --target x86_64-apple-darwin
            mkdir -p target/release
            lipo -create -output target/release/nvoke \
              target/aarch64-apple-darwin/release/nvoke \
              target/x86_64-apple-darwin/release/nvoke
          else
            cargo build --release --locked
          fi

      - name: Package
        run: |
          name="nvoke-tui-$TAG-${{ matrix.asset }}"
          mkdir -p "dist/$name"
          bin=nvoke
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then bin=nvoke.exe; fi
          cp "crates/tui/target/release/$bin" "dist/$name/"
          cp LICENSE "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          file="$name.${{ matrix.archive }}"
          if command -v sha256sum > /dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          ls -l

      - name: Upload to the draft release
        run: |
          cd dist
          for file in nvoke-tui-*.${{ matrix.archive }} nvoke-tui-*.${{ matrix.archive }}.sha256; do
            # A re-run replaces the file from the earlier attempt instead of failing on it.
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
              --jq ".[] | select(.name == \"$file\") | .id")
            if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
            gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$file" \
              -H "Content-Type: application/octet-stream" --input "$file" --jq .name
          done

  publish:
    name: Publish release
    needs: [draft, build, build-tui]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Publish the draft
        env:
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          # Pre-releases never become "Latest"; stable releases always do.
          if [[ "$TAG" == *-* ]]; then
            latest=false; prerelease=true
          else
            latest=true; prerelease=false
          fi

          url=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=$prerelease -f make_latest=$latest --jq .html_url)
          echo "Published: $url" >> "$GITHUB_STEP_SUMMARY"
