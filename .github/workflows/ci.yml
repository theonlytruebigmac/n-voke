name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./crates/core -> target
            ./crates/tui -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Version files in sync
        run: npm run version:check

      - name: TypeScript bindings match the Rust types
        run: npm run bindings:check

      - name: Type-check and build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Core crate tests
        run: cargo test --manifest-path crates/core/Cargo.toml

      - name: Terminal app tests
        run: cargo test --manifest-path crates/tui/Cargo.toml

  # The scripts that run on devices as SYSTEM. Windows PowerShell 5.1 is what they run under in
  # production, so the Windows leg is the one that counts; the Linux leg runs the same tests in pwsh.
  endpoint-scripts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
          - os: ubuntu-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Pester and PSScriptAnalyzer
        run: |
          Install-Module Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyze and test the endpoint scripts
        working-directory: scripts/migration/endpoint
        run: ./run-tests.ps1
